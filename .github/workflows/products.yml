# Týdenní import produktů prodávaných v ČR z Open Food Facts → Slevoměr API.
# Neznámé kódy dohledává server živě při skenu, tohle jen plní databázi pro hledání.
name: Produkty (Open Food Facts)

on:
  schedule:
    - cron: "43 3 * * 3"   # středa 03:43 UTC
  workflow_dispatch:

concurrency:
  group: products
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import
        env:
          SLV_API_BASE: ${{ secrets.SLV_API_BASE }}
          SLV_INGEST_SECRET: ${{ secrets.SLV_INGEST_SECRET }}
        run: python -m slevomer_scraper.off_products
